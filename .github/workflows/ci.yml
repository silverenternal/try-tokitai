name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Check library and binaries
        run: cargo check --all-targets
      - name: Run library tests
        run: cargo test --lib -- --test-threads=4
      - name: Run integration tests
        run: cargo test --tests -- --test-threads=2
      - name: Run documentation tests
        run: cargo test --doc

  frontend-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend integration
        run: |
          node tools/test_chat_state_resilience.mjs
          node tools/test_research_os_wiring.mjs
          node tools/test_research_domains_wiring.mjs
          node tools/test_visualization_wiring.mjs

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build API documentation
        run: cargo doc --no-deps --document-private-items
