[package]
name = "ai-assistant"
version = "0.1.0"
edition = "2021"
description = "A Tokitai-based AI assistant with dual-mode architecture (CLI + Autonomous Evolution)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silverenternal/tokitai"
keywords = ["ai", "tokitai", "assistant", "autonomous", "tool-selection"]
categories = ["development-tools"]

# 项目说明：本项目 (ai-assistant) 是对 tokitai 库的深度实践和扩展实现
# 核心贡献（HybridGapDetector、Prompt Engineering 自进化系统）已回馈到 tokitai 生态

# 允许未使用的变量（调试用）
[lints.rust]
unused_variables = "allow"
unused_imports = "warn"

[lib]
name = "ai_assistant"
path = "src/lib.rs"

# Feature flags for optional dependencies
[features]
default = []
# YAML 支持：用于 OpenAPI 规范解析
yaml = ["serde_yaml"]
# Tensor 计算：实验性功能，提供张量计算和神经网络基础操作
# 注意：此 feature 主要用于 AI/ML 场景的原型验证，生产环境建议使用专用库（如 candle、tch-rs）
tensor = ["dep:candle-core", "dep:candle-nn", "dep:safetensors", "dep:half", "dep:ndarray", "dep:rand"]

[dependencies]
# Core AI framework
tokitai = "0.4.0"
tokitai-core = "0.4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.9", optional = true }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data processing
# csv = "1.3"  # 未使用，注释掉
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
urlencoding = "2.1"
url = "2.5"

# Web scraping
scraper = "0.22"

# File system
dirs = "6"
walkdir = "2.4"
notify = "6.1"
lopdf = "0.34"
memmap2 = "0.9"
pathdiff = "0.2"
tempfile = "3.0"

# Caching and concurrency
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
once_cell = "1.19"

# Cryptography
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"

# Index and search
fst = "0.4"
bk-tree = "0.5"
jieba-rs = "0.7"

# Template engine
tera = "1.19"

# Terminal UI
crossterm = "0.27"

# System utilities
which = "6.0"
libc = "0.2"

# UUID
uuid = { version = "1.0", features = ["v4"] }

# Benchmark dependencies
criterion = { version = "0.5", features = ["html_reports"] }

# Tensor computation (optional, feature-gated)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
safetensors = { version = "0.7", optional = true }
half = { version = "2.4", optional = true }
rand = { version = "0.8", optional = true }
ndarray = { version = "0.16", optional = true }

# ============================================================================
# cargo-machete 忽略列表（这些是 optional feature 或特定场景使用）
# ============================================================================
[package.metadata.cargo-machete]
ignored = [
    "bk-tree",       # 用于 BK-Tree 拼写纠错（IMP-003）
    "candle-core",   # optional tensor feature
    "candle-nn",     # optional tensor feature
    "half",          # optional tensor feature
    "safetensors",   # optional tensor feature
    "ndarray",       # optional tensor feature
    "rand",          # optional tensor feature
    "serde_yaml",    # optional yaml feature
]

# 排除独立测试目录
[workspace]
exclude = ["test_tensor"]

[[bench]]
name = "core_benchmarks"
harness = false
