[package]
name = "ai-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
tokitai = "0.4.0"
tokitai-core = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.9", features = ["json"] }
urlencoding = "2.1"
scraper = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
moka = { version = "0.12", features = ["sync"] }
threadpool = "1.8"
once_cell = "1.19"
futures = "0.3"
bytes = "1.5"

# TUI dependencies
ratatui = "0.29"
crossterm = "0.28"
ctrlc = "3.4"
tui-input = "0.11"

# Path resolver
regex = "1.10"
libc = "0.2"
url = "2.5"

# Context storage
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
pathdiff = "0.2"
tempfile = "3.0"  # for tests

# Chinese text segmentation for semantic indexing
jieba-rs = "0.7"
