[package]
name = "ai-assistant"
version = "0.1.0"
edition = "2021"

# 允许未使用的代码（预留功能）和未使用的变量（调试用）
[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "warn"

# Feature flags for optional dependencies
[features]
default = []
tensor = ["dep:candle-core", "dep:candle-nn", "dep:safetensors", "dep:half", "dep:ndarray"]

[dependencies]
tokitai = "0.4.0"
tokitai-core = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.9", features = ["json"] }
urlencoding = "2.1"
scraper = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
moka = { version = "0.12", features = ["sync"] }
threadpool = "1.8"
once_cell = "1.19"
futures = "0.3"
bytes = "1.5"

# Path resolver
regex = "1.10"
libc = "0.2"
url = "2.5"

# Context storage
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
pathdiff = "0.2"
tempfile = "3.0"  # for tests

# Chinese text segmentation for semantic indexing
jieba-rs = "0.7"

# Base64 decoding for browser tools
base64 = "0.22"

# Directory walking for knowledge index
walkdir = "2.4"

# File system watcher for knowledge sync
notify = "6.1"

# PDF processing for PDF tools
lopdf = "0.34"

# HMAC for dynamic tool signature verification
hmac = "0.12"

# Concurrent data structures for request monitoring
parking_lot = "0.12"

# File locking for safe file operations
fs2 = "0.4"

# Async trait support for tool selector
async-trait = "0.1"

# Terminal UI for interactive input
crossterm = "0.27"

# Template engine for tool generator
tera = "1.19"

# Trie index for tool search optimization (IMP-003)
fst = "0.4"

# BK-Tree for spell correction (IMP-003)
bk-tree = "0.5"

# Benchmark dependencies
criterion = { version = "0.5", features = ["html_reports"] }

# Tensor computation (Phase 1, optional)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
safetensors = { version = "0.7", optional = true }
half = { version = "2.4", optional = true }
rand = "0.8"
ndarray = { version = "0.16", optional = true }

[[bench]]
name = "core_benchmarks"
harness = false

# TODO: Create tensor benchmarks
