[template]
id = "cli_tool"
name = "CLI 工具模板"
description = "用于执行系统命令的 CLI 工具模板"
category = "system_ops"
version = "1.0.0"

[parameters]
command = { type = "string", description = "要执行的命令", required = true }
args = { type = "array", description = "命令参数", required = false }
working_dir = { type = "string", description = "工作目录", required = false }

[code]
language = "rust"
template = '''
use anyhow::Result;
use std::process::Command;

/// {{tool_name}} - {{tool_description}}
pub fn {{tool_name}}(&self, {{param_names}}: {{param_types}}) -> Result<{{return_type}}> {
    // 安全检查：命令黑名单检查
    self.sandbox.validate_command(&{{command_param}})?;
    
    // 执行命令
    let output = Command::new(&{{command_param}})
        {{#if has_args}}
        .args(&{{args_param}})
        {{/if}}
        {{#if has_working_dir}}
        .current_dir(&{{working_dir_param}})
        {{/if}}
        .output()?;
    
    // 处理输出
    {{tool_body}}
    
    // 日志记录
    tracing::info!("{{tool_name}} executed: {}", {{command_param}});
    
    Ok(result)
}
'''

[tests]
language = "rust"
template = '''
#[test]
fn test_{{tool_name}}() {
    let tool = Toolset::new();
    // 使用安全命令测试
    let result = tool.{{tool_name}}("echo", vec!["hello"]);
    assert!(result.is_ok());
}
'''

[safety]
notes = '''
- 命令必须通过黑名单检查
- 禁止执行危险命令（rm, sudo, kill 等）
- 输出需要限制大小
'''

[examples]
usage = '''
// 执行安全命令
let output = run_safe_command("ls", vec!["-la"]).await?;

// 获取环境变量
let value = get_env("PATH").await?;

// 获取当前目录
let cwd = get_current_dir().await?;
'''
