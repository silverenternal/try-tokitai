[package]
name = "ai-scientist-core"
version = "0.1.0"
edition = "2021"
description = "Core Agent Framework for AI Scientist — Agent trait, MessageBus, Scheduler"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
toml = "0.8"
futures = "0.3"
