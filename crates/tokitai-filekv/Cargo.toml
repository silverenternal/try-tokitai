[package]
name = "tokitai-filekv"
version = "0.5.0"
edition = "2021"
description = "实验性生产级 LSM-Tree KV 存储引擎，具备完整错误体系、指标体系和崩溃安全机制"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silverenternal/tokitai"
keywords = ["kv", "storage", "lsm-tree", "database", "embedded"]
categories = ["database-implementations", "data-structures"]

[lib]
name = "tokitai_filekv"
path = "src/lib.rs"

# Test configuration for parallel execution
# Note: cargo-nextest is recommended for optimal parallel test execution
# See README.md for usage instructions

[features]
default = ["wal"]
# WAL (Write-Ahead Log) for crash recovery
wal = []
# mimalloc allocator for improved memory allocation performance
mimalloc = ["dep:mimalloc"]
# Performance benchmarks
benchmarks = ["dep:criterion"]
# RocksDB fair comparison benchmarks
rocksdb-compare = ["dep:rocksdb", "benchmarks"]
# Prometheus metrics exporter
metrics = ["dep:prometheus", "dep:metrics", "dep:metrics-exporter-prometheus"]
# Async I/O support
async-io = ["dep:tokio"]
# Full features - all optional features enabled
full = ["wal", "metrics", "async-io"]

[dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
bincode = "1.3"

# Async runtime (optional)
tokio = { version = "1", features = ["full"], optional = true }

# Cryptography
sha2 = "0.10"
hex = "0.4"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem
memmap2 = "0.9"
tempfile = "3"

# Data structures
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
moka = { version = "0.12", features = ["sync"] }
bytes = "1.5"
ahash = { version = "0.8", features = ["serde"] }
arc-swap = "1.7"  # RES-001: Lock-free Arc<Mmap> management
mimalloc = { version = "0.1", default-features = false, optional = true }
num_cpus = "1"

# Bloom filter
bloom = "0.3"

# Compression
zstd = "0.13"
snap = "1.1"
lz4 = "1.24"

# Text processing

# Parallel processing
rand = "0.8"

# Benchmarking (optional)
criterion = { version = "0.5", optional = true }

# RocksDB for fair comparison benchmarks (optional)
rocksdb = { version = "0.24", optional = true, features = ["lz4", "zstd"] }

# Prometheus metrics (optional)
prometheus = { version = "0.13", optional = true }

# Metrics exporter (optional)
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }
rayon = "1.11.0"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
futures = "0.3"
proptest = "1.4"

[[bench]]
name = "file_kv_bench"
path = "benches/file_kv_bench.rs"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "adaptive_bloom_bench"
path = "benches/adaptive_bloom_bench.rs"
