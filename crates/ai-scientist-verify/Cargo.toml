[package]
name = "ai-scientist-verify"
version = "0.1.0"
edition = "2021"
description = "Mathematical and formal verification tools for AI Scientist — SymPy + Lean4"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
