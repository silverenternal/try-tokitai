[package]
name = "ai-scientist-rag"
version = "0.1.0"
edition = "2021"
description = "RAG system for AI Scientist — PDF parsing, chunking, embeddings, vector DB, retrieval"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
async-trait = "0.1"
blake3 = "1"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
