[package]
name = "ai-scientist-science"
version = "0.1.0"
edition = "2021"
description = "Science computation layer — Chemistry, Biology, Simulation tool interfaces"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "macros", "rt"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
