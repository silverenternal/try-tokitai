# AI Assistant 配置文件

[ai]
# 模型名称
model = "qwen3.5:397b"
# 温度（0.0-1.0，越高越有创造性）
temperature = 0.7
# 最大 token 数
max_tokens = 4096

# ============================================================================
# 多模型提供商配置 (Multi-Provider Configuration)
# ============================================================================
# 支持以下提供商：openai, gemini, anthropic, zhipu, moonshot, ollama
# 在 .env 文件中配置 PROVIDERS 和各提供商的 API 密钥

[llm]
# 默认提供商（可选，留空则使用第一个可用的提供商）
# default_provider = "ollama"

# 模型路由策略：cost_optimized, quality_optimized, latency_optimized, balanced
# routing_strategy = "balanced"

# 路由约束（可选）
# max_latency_ms = 5000
# max_cost_per_1k_tokens = 0.10
# min_quality_score = 6.0

# 任务类型模型覆盖（可选）
# [llm.task_overrides]
# code_generation = "openai/gpt-4o"
# code_review = "anthropic/claude-3-5-sonnet-20241022"
# documentation = "zhipu/glm-4"

[search]
# SearXNG 服务地址（推荐配置，提高搜索可靠性）
# searxng_url = "https://searx.be"
# 搜索引擎列表
engines = ["bing", "duckduckgo"]
# 搜索缓存容量（条数）
cache_capacity = 100
# 缓存过期时间（秒）
cache_ttl_secs = 3600

[user_tools]
# 默认工作目录（文件操作、项目模板等）
# 留空表示使用当前工作目录
# workspace_dir = "./workspace"

# 默认下载目录
# 留空表示使用系统下载目录（或回退到 ./downloads）
download_dir = "./downloads"

[context]
# 上下文存储根目录（可选，留空则使用 ./.context）
# root_dir = "./.context"
# 短期层最大保留轮数（超出自动裁剪）
max_short_term_rounds = 10
# 是否启用 mmap 内存映射优化（大文件读取更高效）
enable_mmap = true
# 是否启用增量日志（记录所有上下文变更）
enable_logging = true
# 是否启用内容去重（相同内容只存储一次）
enable_deduplication = true

# ⭐ 知识库配置
# 知识库根目录（用于从目录结构构建知识索引）
knowledge_root = "./docs"
# 是否从目录结构自动同步分类到长期层
auto_sync_categories = true
# 是否启用知识索引（提问时自动推荐相关知识）
enable_knowledge_index = true
# 知识索引更新间隔（秒）
index_update_interval_secs = 300
# 自动推荐相关知识（提问时根据关键词匹配）
auto_recommend_knowledge = true
# 推荐阈值（0-1，越高越严格）
recommend_threshold = 0.5
# 最多推荐知识数量
recommend_limit = 3
